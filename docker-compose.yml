version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blayblay-home
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - db
    # ถ้ามี .env สามารถ uncomment บรรทัดข้างล่างได้
    # env_file:
    #   - .env

  db:
    image: postgres:15-alpine
    container_name: blayblay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blayblay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:


version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blayblay-home
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # ถ้ามี .env สามารถ uncomment บรรทัดข้างล่างได้
